services:
  - type: web
    name: skytrace-drone-api-t3849411
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./codes/server/Dockerfile
    dockerContext: ./codes/server
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MODEL_PATH
        value: /app/drone-detection-yolo26n.pt
      - key: MODEL_WARMUP
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_IMAGE_PIXELS
        value: "40000000"
      - key: DEFAULT_CONFIDENCE
        value: "0.25"
      - key: DEFAULT_IOU
        value: "0.7"
      - key: CORS_ORIGINS
        value: https://skytrace-drone-web-t3849411.onrender.com
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib

  - type: web
    name: skytrace-drone-web-t3849411
    runtime: static
    buildCommand: cd codes/client && npm ci && npm run build
    staticPublishPath: ./codes/client/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://skytrace-drone-api-t3849411.onrender.com
    headers:
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
